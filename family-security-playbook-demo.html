<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Family Security Playbook Demo</title>
<style>
:root{--primary:#1B2A1F;--accent:#CB5A28;--accent-ink:#A8461C;--bg:#FBF8F1;--card:#FFFFFF;--ink:#1F241E;--soft:#55604F;--line:#CFC7B2;--ok:#2F6B3A;--bad:#9B2D1C;--tip:#F3EEDF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 Georgia,'Times New Roman',serif}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{background:var(--primary);color:#F7F2E7;padding:18px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{max-height:44px;max-width:160px;background:#fff;border-radius:4px;padding:3px}
header b{font:700 22px/1.2 system-ui,'Segoe UI',Arial,sans-serif}
header span{font:15px/1.3 system-ui,'Segoe UI',Arial,sans-serif;color:#D9D3C2;margin-left:auto;text-align:right}
.bar{height:10px;background:#E6DFCC}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
main{padding:26px 0 60px}
.stepno{font:600 15px/1 system-ui,'Segoe UI',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 6px}
h1{font:700 32px/1.15 system-ui,'Segoe UI',Arial,sans-serif;margin:0 0 10px;text-wrap:balance}
p.lead{margin:0 0 18px;color:var(--soft);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;margin:0 0 16px}
.tip{background:var(--tip);border-left:5px solid var(--accent);padding:14px 16px;margin:0 0 16px;border-radius:0 6px 6px 0;font-size:17.5px}
.tip b{display:block;font-family:system-ui,'Segoe UI',Arial,sans-serif}
label{display:block;font:600 17px/1.3 system-ui,'Segoe UI',Arial,sans-serif;margin:0 0 6px}
.f{margin:0 0 16px}.f small{display:block;color:var(--soft);font-size:16px;margin-top:4px}
input[type=text],input[type=tel],select,textarea{width:100%;font:19px/1.3 system-ui,'Segoe UI',Arial,sans-serif;padding:12px 12px;border:2px solid #9C947E;border-radius:6px;background:#fff;color:var(--ink);min-height:50px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px;background:#FDFCF8}
.item .x{float:right;border:0;background:none;color:var(--bad);font:600 16px system-ui,sans-serif;cursor:pointer;padding:6px;min-height:40px}
.checks label{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-family:Georgia,serif;font-size:18.5px;padding:8px 0;cursor:pointer}
.checks input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--primary)}
.btn{font:700 19px/1 system-ui,'Segoe UI',Arial,sans-serif;padding:16px 22px;border-radius:8px;border:2px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;min-height:56px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{font-size:16.5px;padding:10px 14px;min-height:46px}
.btn:disabled{opacity:.55;cursor:default}
.nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.msg{font:600 17px/1.4 system-ui,sans-serif;min-height:1.4em;margin:14px 0 0}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.sum{margin:0;padding:0;list-style:none}.sum li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.sum li b{font-family:system-ui,sans-serif;font-size:17px}
.files{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.file{position:relative;overflow:hidden;display:inline-flex;align-items:center}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
footer{font:15px/1.5 system-ui,sans-serif;color:var(--soft);padding:0 0 40px}
@media (max-width:560px){body{font-size:18px}h1{font-size:27px}.row{grid-template-columns:1fr}header span{margin-left:0;text-align:left}.nav .btn{flex:1 1 100%}}
@media print{header,.bar,.nav,footer{display:none}}

#demoBar{background:#3A2A10;color:#FBE9C6;font:600 15px/1.4 system-ui,'Segoe UI',Arial,sans-serif;padding:9px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
#demoBar button{font:600 14px system-ui,sans-serif;background:none;border:1px solid #FBE9C6;color:#FBE9C6;border-radius:5px;padding:5px 10px;cursor:pointer}
#demo{background:var(--bg);min-height:100vh}
body.demo-front>header,body.demo-front>.bar,body.demo-front>main,body.demo-front>footer{display:none}
#demo .hero{background:var(--primary);color:#F7F2E7;padding:44px 0 40px}
#demo .hero h1{font-size:40px;margin:0 0 12px;color:#F7F2E7}#demo .hero p{font-size:21px;max-width:38em;margin:0;color:#E2DCCB}
#demo .hero small{display:block;font:600 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#E9B48F;margin-bottom:10px}
#demo h2{font:700 26px/1.2 system-ui,'Segoe UI',Arial,sans-serif;margin:34px 0 14px}
#demo .gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:0;list-style:none;margin:0}
#demo .gets li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
#demo .gets b{display:block;font:700 18px system-ui,sans-serif;margin-bottom:4px}
#demo .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
#demo .plan{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column}
#demo .plan.best{border-color:var(--accent)}
#demo .plan b{font:700 19px/1.25 system-ui,sans-serif}#demo .plan .p{font:700 34px/1.1 system-ui,sans-serif;margin:10px 0 6px}
#demo .plan span{flex:1;color:var(--soft);font-size:17px;margin-bottom:14px}
#demo .story{background:var(--tip);border-left:5px solid var(--accent);padding:16px 18px;border-radius:0 6px 6px 0;margin-top:30px}
#demo .wrap{max-width:980px}
@media (max-width:560px){#demo .hero h1{font-size:30px}#demo .hero p{font-size:18.5px}}
</style>
</head>

    const used = [...new Set(accts.map(a => a.step))].filter(s => MFA[s]);
    if (I.mfa && used.length) {
      heading("Your second login step", "After your password, the website asks for one more thing that only you have. Here is how each kind works.");
      used.forEach(s => {
        sub(MFA[s].title(mfa));
        steps(MFA[s].steps(mfa));
      });
      callout("About login codes and approvals", [
        "A code or an approval request is a second key to your account.",
        "Type a code only into a website or app that you opened yourself.",
        "Never read a code to anyone on the phone. Your bank will not ask for it, and neither will I.",
        "If your phone asks you to approve a sign-in you did not start, tap No and tell your family helper.",
      ]);
      if (clean(mfa.backup)) para("If you lose your phone: your backup codes are kept " + mfa.backup + ". Ask your family helper to sit with you when you use them.", { after: 8 });
      else para("If you lose your phone, call your family helper before you try to sign in anywhere.", { after: 8 });
    }

    if (I.redflags) {
      heading("How to spot a scam", "One of these is a warning. Two or more is almost certainly a scam.");
      checks(RED_FLAGS);
      sub("What to do every time");
      steps(RULES);
      if (d.codeWord) para("Your family has a code word. It is not written here. Anyone who calls saying they are family and need money must say it. If they cannot, hang up.", { s: "bold", after: 8 });
    }

    const rem = d.remote || {};
    if (I.remote) {
      heading("How I help you from a distance", "Sometimes I need to see your screen to help. These rules never change.");
      steps([
        "You call me, or we set a time. I do not connect without talking to you first.",
        clean(rem.tool) ? "The only program I use is " + rem.tool + ". If anyone asks you to install a different one, it is not me." : "I will tell you the name of the one program I use. If anyone asks you to install a different one, it is not me.",
        "You start the connection yourself and read me the code on your screen.",
        "You can see everything I do. You can end the connection at any time by closing the window.",
        rem.stays ? "The program stays on your device so I can help you quickly. It cannot connect unless you approve it." : "When we finish, I end the connection and remove the program.",
      ]);
      para("Banks, Microsoft, Apple, Medicare and the government never ask to connect to your computer.", { s: "bold", after: 8 });
    }

    /* ================= STEP 3: ADJUST ================= */
    part(3, "Adjust", "Keeping it current");
    if (I.routine) {
      heading("Your ten-minute monthly check", "Pick a day, such as the first of the month, and tick these off.");
      checks(MONTHLY);
      sub("Once a year");
      checks(YEARLY);
    }
    if (clean(c.reviewBy)) {
      callout("This playbook has a review date", [
        "Phone numbers, websites and scams change. Review this playbook by " + c.reviewBy + ".",
        "Before then, go through it with your family helper and print a new version.",
        "Also update this playbook if you get a new phone or computer, change banks, or move.",
      ]);
    }
    const hot = (d.hotlines || []).filter(h => clean(h.name));
    if (I.report && hot.length) {
      heading("Where to report fraud and get help", "Call your bank first if money is involved. A report also strengthens a bank dispute.", 140);
      table(["Who", "Phone", "Website", "Use it for"], hot.map(h => [h.name, h.phone || "", h.web || "", h.when || ""]), [0.29, 0.2, 0.23, 0.28], { size: 10, boldCols: [1] });
      if (clean(d.hotlinesChecked)) para("Phone numbers last checked " + d.hotlinesChecked + ".", { size: 9, c: P.soft, f: "courier" });
    }
    if (I.family) {
      heading("For your family helper", helper ? helper + ", this page is for you." : "Share this page with the person you trust to help.");
      checks(HELPER);
    }

    callout("Rules that never change", [
      "Nobody honest asks for your passwords or for the codes sent to your phone.",
      "Nobody honest asks to be paid in gift cards, wire transfers or cryptocurrency.",
      "If a caller says they are from your bank, a company or the government, hang up and dial the number in this playbook yourself.",
    ]);
    const s = d.seller || {};
    if (clean(s.name)) {
      k.need(64);
      k.font("helvetica", "bold", 13); k.col(P.ink); doc.text(clean("Want someone to check this with you?  " + s.name), M, k.y + 10); k.y += 20;
      k.font("courier", "normal", 10); k.col(P.soft); doc.text(clean([s.phone, s.email, s.web].filter(Boolean).join("   ·   ")), M, k.y + 8); k.y += 16;
    }

    k.footers("Personal Security Playbook  ·  " + who + "  ·  " + brand + (d.orderRef ? "  ·  " + d.orderRef : ""));
    return doc;
  }

  /* ================= the service agreement (plain-language statement of work) ================= */
  function buildAgreement(jsPDF, d) {
    const k = kit(jsPDF, d), { doc, P, M, me } = k;
    const { para, heading, steps, checks, callout } = k;
    const c = d.client || {}, a = d.agreement || {}, rem = d.remote || {};
    const who = clean(c.name) || "Client";
    const brand = clean(me.brand || me.company || "");
    const helper = clean(c.helperName);
    const lines = t => (Array.isArray(t) ? t : String(t || "").split("\n")).map(s => clean(s)).filter(Boolean);

    k.headerBand("Service agreement  ·  " + brand, who, [
      "Agreement " + (a.number || "") + "  ·  " + (c.date || ""),
      "Read this before any work starts. Ask me about anything that is not clear.",
    ]);

    heading("1. Who this agreement is between");
    para((me.company || "The company") + (brand && brand !== clean(me.company) ? ", doing business as " + brand + "," : "") + " (\"I\" or \"me\"), represented by " + (me.name || "") + ", and " + who + " (\"you\")." + (helper ? " " + helper + (c.helperRelation ? ", your " + c.helperRelation + "," : "") + " is your family helper and may join any call." : ""));

    heading("2. What I will do", clean(a.service) + (clean(a.timeline) ? "  ·  " + a.timeline : ""));
    checks(lines(a.includes), { dot: true });

    if (lines(a.excludes).length) { heading("3. What is not included"); checks(lines(a.excludes), { dot: true }); }

    heading("4. How we will work together");
    steps([
      "I never ask for your passwords. You type them yourself.",
      "You can watch everything I do, and you can stop at any time.",
      "A family member or friend is welcome on every call.",
      "I explain what I am doing in plain language. If something is not clear, ask me to slow down.",
    ]);

    heading("5. Your permission for remote access");
    para("Some of this work is done by connecting to your computer or phone over the internet" + (clean(rem.tool) ? ", using " + rem.tool : "") + ". I connect only while we are talking, and only after you start the connection yourself. " + (rem.stays ? "The program stays on your device so I can help you quickly. It cannot connect unless you approve it each time." : "When we finish, I end the connection and remove the program."));
    checks(["I give permission for remote access as described above. (Tick and initial: ______ )"]);

    heading("6. Your information stays with you");
    para("I keep only what I need to do this work: your name, contact details, and my notes. They are stored on my own encrypted computer, not in an online service. I do not sell or share your information. I do not keep your passwords, card numbers or account numbers. Within 30 days after the work ends I delete my notes, keeping only this agreement, your invoice, and what the law requires.");

    heading("7. Price and payment");
    para("The price for this work is " + (clean(a.price) || "[price]") + ". " + (clean(a.payment) || "Payment is due before work starts."), { s: "bold" });
    para("You can pay by card through a secure checkout page, or by check. I never accept gift cards, wire transfers, cryptocurrency or payment apps. You will get a receipt.");

    heading("8. What I cannot promise");
    checks([
      "I cannot promise that lost money will be returned. That decision belongs to your bank or card company. I will make your claim as strong and well documented as possible.",
      "No one can promise that you will never be targeted again. I can make it much harder and make sure you know what to do.",
      "I am not a lawyer or a financial advisor. I will tell you when it makes sense to talk to one.",
    ], { dot: true });
    para("If something goes wrong because of a mistake I made, my responsibility is limited to the amount you paid me under this agreement.", { size: 11.5, c: P.soft });

    heading("9. Changing or cancelling");
    para(clean(a.cancel) || "You can cancel before work starts and receive a full refund. After work starts, you can stop at any time and you pay only for the work already done. If the work turns out to be larger than we agreed, I will tell you and get your approval in writing before doing more.");

    callout("Before you sign", [
      "Take your time. You can talk it over with family first.",
      "If anyone pressures you to sign or pay quickly, including me, stop and call someone you trust.",
    ]);

    k.signLine("Your signature", who);
    if (helper) k.signLine("Family helper (optional)", helper);
    k.signLine("For " + (me.company || brand), me.name || "");

    k.footers("Service Agreement " + (a.number || "") + "  ·  " + who + "  ·  " + brand + "  ·  " + (me.phone || ""));
    return doc;
  }

  const api = { build, buildAgreement, PM: Object.keys(PM), MFA: Object.keys(MFA) };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Playbook = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
(function () {
  "use strict";
  const GATE = window.__DEMO_GATE;
  const D = window.PlaybookDefaults, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const seller = GATE.seller || {};
  const fmt = d => d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  const today = new Date(), nextYear = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());

  /* branding from the gate (colors are validated server-side) */
  if (seller.primary) document.documentElement.style.setProperty("--primary", seller.primary);
  if (seller.accent) { document.documentElement.style.setProperty("--accent", seller.accent); document.documentElement.style.setProperty("--accent-ink", seller.accent); }
  if (seller.logo) $("logo").innerHTML = '<img alt="" src="' + esc(seller.logo) + '">';
  $("brand").textContent = seller.product || "Family Security Playbook";
  $("access").textContent = GATE.expires ? "Access through " + fmt(new Date(GATE.expires)) + (GATE.seats > 1 ? " · " + GATE.seats + " playbooks" : "") : "";
  $("foot").textContent = [seller.name, seller.phone, seller.web].filter(Boolean).join(" · ") + (GATE.order ? "  ·  Order " + GATE.order : "");
  document.title = (seller.product || "Family Security Playbook");

  const fresh = () => ({
    who: "parent", client: { name: "", helperName: "", helperRelation: "", helperPhone: "" },
    banks: [{ name: "", phone: "", note: "" }],
    carrier: { name: "", phone: "", number: "", lock: D.carrierLocks[3] },
    contacts: [{ type: "Health insurance", name: "", phone: "", note: "" }, { type: "Doctor", name: "", phone: "", note: "" }, { type: "Internet provider", name: "", phone: "", note: "" }],
    accounts: [{ name: "Email", step: "Not turned on yet", note: "" }, { name: "Bank website", step: "Not turned on yet", note: "" }],
    mfa: { app: "", backup: "" }, pm: { name: "", kit: "" },
    devices: [{ name: "", lock: "", updates: "Automatic", backup: "" }],
    codeWord: false, done: [], todo: "", step: 0,
  });
  let S; try { S = JSON.parse(sessionStorage.getItem("diy") || "null"); } catch (e) { S = null; }
  S = Object.assign(fresh(), S || {});
  const keep = () => { try { sessionStorage.setItem("diy", JSON.stringify(S)); } catch (e) {} };
  const them = () => S.who === "me" ? "you" : "they";
  const their = () => S.who === "me" ? "your" : "their";

  /* ---- small field builders ---- */
  const field = (path, label, o = {}) => `<div class="f"><label for="${path}">${esc(label)}</label><input type="${o.type || "text"}" id="${path}" data-p="${path}" value="${esc(get(path))}" ${o.list ? `list="${o.list}"` : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} autocomplete="off">${o.help ? `<small>${esc(o.help)}</small>` : ""}</div>`;
  const select = (path, label, opts, o = {}) => `<div class="f"><label for="${path}">${esc(label)}</label><select id="${path}" data-p="${path}">${opts.map(x => `<option${x === get(path) ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${o.help ? `<small>${esc(o.help)}</small>` : ""}</div>`;
  const tip = (h, t) => `<div class="tip"><b>${esc(h)}</b>${esc(t)}</div>`;
  const list = (id, arr) => `<datalist id="${id}">${arr.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`;
  function get(path) { return path.split(".").reduce((o, k) => (o == null ? "" : o[k]), S) ?? ""; }
  function set(path, v) { const ks = path.split("."); let o = S; ks.slice(0, -1).forEach(k => { o = o[k]; }); o[ks[ks.length - 1]] = v; }
  const rows = (key, blank, addLabel, inner) => S[key].map((r, i) => `<div class="item"><button type="button" class="x" data-del="${key}.${i}" aria-label="Remove this one">Remove</button>${inner(i)}</div>`).join("") + `<button type="button" class="btn sm" data-add="${key}">${esc(addLabel)}</button>`;
  const BLANK = { banks: { name: "", phone: "", note: "" }, contacts: { type: "Other", name: "", phone: "", note: "" }, accounts: { name: "", step: "Not turned on yet", note: "" }, devices: { name: "", lock: "", updates: "Automatic", backup: "" } };

  const STEPS = [
    { title: "Let's build a security playbook", lead: "About 20 minutes. You will finish with a large-print guide to keep by the computer: who to call, what to do if something seems wrong, and how the accounts are protected.",
      body: () => tip("Before you start", "Have a recent bank statement, the cell phone bill and an insurance card nearby. You will copy phone numbers from them. You will never be asked for a password.") +
        `<div class="card"><div class="f"><label for="who">Who is this playbook for?</label><select id="who" data-p="who"><option value="parent"${S.who === "parent" ? " selected" : ""}>A parent or relative</option><option value="me"${S.who === "me" ? " selected" : ""}>Myself</option></select></div>
        <div class="files"><span class="btn sm file">Open saved answers<input type="file" id="openFile" accept=".json,application/json" aria-label="Open saved answers"></span><small style="color:var(--soft)">Started before? Open the file you saved.</small></div></div>` },
    { title: "Who is it for, and who helps them?", lead: "The family helper is the first person to call when something seems wrong. It works best when it is someone who will answer the phone.",
      body: () => `<div class="card">${field("client.name", S.who === "me" ? "Your full name" : "Their full name", { help: "This name is printed on the playbook." })}</div>
        <div class="card">${field("client.helperName", "Family helper's name")}<div class="row">${field("client.helperRelation", "Relationship", { ph: "daughter, son, neighbor…" })}${field("client.helperPhone", "Their phone number", { type: "tel" })}</div></div>`,
      check: () => S.client.name.trim() ? "" : "Please enter the name for the playbook." },
    { title: "Banks and cards", lead: "List each bank, credit union and card. In a scare, this is the page that matters most.",
      body: () => tip("Where to find the number", "Use the phone number on the back of the card or on a statement. Do not search for it online: fake bank numbers are a common trap.") + list("bankList", D.bankNames) +
        rows("banks", BLANK.banks, "Add another bank or card", i => `${field(`banks.${i}.name`, "Bank or card name", { list: "bankList" })}<div class="row">${field(`banks.${i}.phone`, "Phone number from the card", { type: "tel" })}${field(`banks.${i}.note`, "What is it?", { ph: "Checking, credit card…" })}</div>`) },
    { title: "Cell phone company", lead: "Thieves sometimes move a phone number to their own phone to catch security codes. A number lock stops that.",
      body: () => tip("Ask for a number lock", "Call the cell phone company, or dial 611 from the phone, and say: \"Please add a number lock and an account PIN so my number cannot be moved without it.\"") +
        `<div class="card"><div class="f"><label for="carrier.name">Cell phone company</label><select id="carrier.name" data-p="carrier.name"><option value="">Choose…</option>${Object.keys(D.carriers).map(x => `<option${x === S.carrier.name ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        <div class="row">${field("carrier.phone", "Customer service number", { type: "tel", help: "Check it against the bill. 611 from the cell phone also works." })}${field("carrier.number", "The cell phone number", { type: "tel" })}</div>${select("carrier.lock", "Number lock and account PIN", D.carrierLocks)}</div>` },
    { title: "Other important numbers", lead: "Insurance, doctor, pharmacy, internet and TV. Scammers often pretend to be one of these.",
      body: () => list("contactList", D.contactNames) + rows("contacts", BLANK.contacts, "Add another", i => `<div class="row">${select(`contacts.${i}.type`, "Type", D.contactTypes)}${field(`contacts.${i}.name`, "Name", { list: "contactList" })}</div><div class="row">${field(`contacts.${i}.phone`, "Phone number from the card or bill", { type: "tel" })}${field(`contacts.${i}.note`, "Note", { ph: "Optional" })}</div>`) },
    { title: "Accounts and the second login step", lead: "A second step, such as a code sent to the phone, keeps a thief out even when they have the password. Email and banking matter most.",
      body: () => tip("How to turn it on", "Sign in to the account, open Settings, then Security, and look for \"two-step verification\" or \"two-factor\". Choose \"Not turned on yet\" below for any you still need to do; the playbook will list them as to-dos.") + list("acctList", D.accountNames) +
        rows("accounts", BLANK.accounts, "Add another account", i => `<div class="row">${field(`accounts.${i}.name`, "Account", { list: "acctList" })}${select(`accounts.${i}.step`, "Second login step", D.stepOptions)}</div>`) +
        `<div class="card" style="margin-top:16px">${field("pm.name", "Password manager, if one is used", { ph: "Apple Passwords, Bitwarden, Google…", help: "Leave blank if passwords are kept another way. Never write a password here." })}${field("mfa.backup", "Where backup codes and the emergency sheet are kept", { ph: "in the fireproof box in the hall closet" })}</div>` },
    { title: "Devices", lead: "The phones, tablets and computers that are used for email or banking.",
      body: () => rows("devices", BLANK.devices, "Add another device", i => `${field(`devices.${i}.name`, "Device", { ph: "iPhone, HP laptop, iPad…" })}<div class="row">${field(`devices.${i}.lock`, "How it is locked", { ph: "Passcode, fingerprint, PIN…" })}${select(`devices.${i}.updates`, "Updates", ["Automatic", "I do them by hand", "Not sure"])}</div>${field(`devices.${i}.backup`, "Backup", { ph: "iCloud, external drive, none yet…" })}`) },
    { title: "What is already in place?", lead: "Tick what is done. Anything not ticked becomes the to-do list in the playbook.",
      body: () => `<div class="card checks">${D.setups.map((x, i) => `<label><input type="checkbox" data-done="${i}"${S.done.includes(x) ? " checked" : ""}><span>${esc(x.replace(/^Agreed a/, "Agreed on a"))}</span></label>`).join("")}</div>` +
        tip("A family code word", "Pick a word only the family knows. Anyone who calls asking for money and claiming to be family must say it. It defeats the \"grandchild in trouble\" call and voice-cloning scams.") },
    { title: "Review and download", lead: "Check the details, then download the playbook. Print it and keep it by the computer.",
      body: () => { const n = a => a.filter(x => (x.name || "").trim()).length;
        return `<div class="card"><ul class="sum"><li><b>Playbook for</b><span>${esc(S.client.name || "Not entered")}</span></li><li><b>Family helper</b><span>${esc(S.client.helperName || "None listed")}</span></li><li><b>Banks and cards</b><span>${n(S.banks)}</span></li><li><b>Cell phone company</b><span>${esc(S.carrier.name || "Not listed")}</span></li><li><b>Other numbers</b><span>${n(S.contacts)}</span></li><li><b>Accounts</b><span>${n(S.accounts)}</span></li><li><b>Devices</b><span>${n(S.devices)}</span></li></ul></div>
        <div class="card"><p style="margin:0 0 12px">This purchase covers <b>${GATE.seats} playbook${GATE.seats === 1 ? "" : "s"}</b>${GATE.seats === 1 ? ", for one person" : ""}. The first download fixes the name. You can correct other details and download again as often as you need until your access ends.</p>
        <div class="files"><button type="button" class="btn go" id="make">Download the playbook (PDF)</button><button type="button" class="btn sm" id="saveFile">Save my answers to a file</button></div></div>` +
        printCard() +
        (seller.name ? tip("Want someone to check it with you?", [seller.name, seller.phone, seller.web].filter(Boolean).join(" · ")) : ""); } },
  ];

  let lastPdf = null, printed = "";
  function printCard() {
    if (printed) return `<div class="card"><b style="font-family:system-ui,sans-serif">Sent for printing.</b> Reference ${esc(printed)}. It will be mailed to ${esc(GATE.shipTo)}. You will get an email when it ships.</div>`;
    if (GATE.prints > 0) return `<div class="card"><label style="margin-bottom:10px">Your printed copy</label><p style="margin:0 0 12px">Your order includes a large-print, bound copy mailed to <b>${esc(GATE.shipTo || "the address you gave at checkout")}</b>. Download the playbook and check it first; the printed copy is made from that download.</p>
      <div class="checks"><label><input type="checkbox" id="printOk"><span>I agree to send this playbook to ${esc(seller.name || "the seller")} and their printing company so it can be printed and mailed. The stored file is deleted when it ships, and no later than ${GATE.keepDays} days from now.</span></label></div>
      <button type="button" class="btn" id="sendPrint">Send for printing</button></div>`;
    if (GATE.printUrl) return `<div class="card"><label style="margin-bottom:8px">Want a printed copy?</label><p style="margin:0 0 12px">We can print a large-print, bound copy and mail it. Finish and download your playbook first.</p><a class="btn sm" style="display:inline-block;text-decoration:none" href="${esc(GATE.printUrl)}">Add a printed copy</a></div>`;
    return "";
  }
  async function sendPrint() {
    if (!lastPdf) { say("Download the playbook first and check it. Then send it for printing.", "bad"); return; }
    if (!$("printOk").checked) { say("Please tick the box to agree before sending.", "bad"); return; }
    const btn = $("sendPrint"); btn.disabled = true; say("Sending your playbook to be printed…");
    try {
      const r = await fetch("/api/print", { method: "POST", headers: { "content-type": "application/pdf", "x-gate-token": GATE.t, "x-name-hash": lastPdf.h, "x-consent": "yes" }, body: lastPdf.blob });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) { say(j.message || "It could not be sent. Please try again.", "bad"); btn.disabled = false; return; }
      printed = j.id; GATE.prints = j.left; draw(); say("Sent for printing. You will get an email when it ships.", "ok");
    } catch (e) { say("It could not be sent. Check your connection and try again.", "bad"); btn.disabled = false; }
  }
  function draw(focus) {
    const s = STEPS[S.step];
    $("stepno").textContent = "Step " + (S.step + 1) + " of " + STEPS.length;
    $("title").textContent = s.title.replace("they", them());
    $("lead").textContent = s.lead; $("body").innerHTML = s.body();
    $("prog").style.width = Math.round((S.step) / (STEPS.length - 1) * 100) + "%";
    $("back").style.visibility = S.step ? "visible" : "hidden";
    $("next").style.display = S.step === STEPS.length - 1 ? "none" : "";
    $("next").textContent = S.step === 0 ? "Start" : "Next";
    say("");
    if (focus) { window.scrollTo(0, 0); $("title").focus(); }
  }
  const say = (t, cls) => { const m = $("msg"); m.textContent = t; m.className = "msg" + (cls ? " " + cls : ""); };

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.p) { set(t.dataset.p, t.value); if (t.dataset.p === "carrier.name") { S.carrier.phone = D.carriers[t.value] || ""; keep(); draw(); return; } keep(); }
    else if (t.dataset.done !== undefined) { const x = D.setups[+t.dataset.done]; S.done = t.checked ? [...new Set([...S.done, x])] : S.done.filter(y => y !== x); S.codeWord = S.done.includes("Agreed a family code word"); keep(); }
  });
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-add]"), d = e.target.closest("[data-del]");
    if (a) { S[a.dataset.add].push({ ...BLANK[a.dataset.add] }); keep(); draw(); }
    else if (d) { const [k, i] = d.dataset.del.split("."); S[k].splice(+i, 1); if (!S[k].length) S[k].push({ ...BLANK[k] }); keep(); draw(); }
    else if (e.target.id === "make") make();
    else if (e.target.id === "sendPrint") sendPrint();
    else if (e.target.id === "saveFile") offer("playbook-answers.json", new Blob([JSON.stringify({ app: "diy-playbook", v: 1, data: S }, null, 2)], { type: "application/json" }));
  });
  document.addEventListener("change", async e => {
    if (e.target.id !== "openFile") return;
    try { const j = JSON.parse(await e.target.files[0].text()); if (j.app !== "diy-playbook") throw 0; S = Object.assign(fresh(), j.data, { step: 1 }); keep(); draw(true); say("Opened your saved answers.", "ok"); }
    catch (err) { say("That file is not a saved playbook.", "bad"); }
  });
  $("next").addEventListener("click", () => { const s = STEPS[S.step], bad = s.check && s.check(); if (bad) { say(bad, "bad"); return; } S.step = Math.min(STEPS.length - 1, S.step + 1); keep(); draw(true); });
  $("back").addEventListener("click", () => { S.step = Math.max(0, S.step - 1); keep(); draw(true); });

  function offer(filename, blob) { if (window.__demoSave) return window.__demoSave(filename, blob); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  async function nameHash(name) {
    const norm = name.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(GATE.t + "|" + norm));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  function data() {
    const helper = S.client.helperName.trim(), named = a => a.filter(x => (x.name || "").trim());
    const todo = D.setups.filter(x => !S.done.includes(x)).concat(named(S.accounts).filter(a => a.step === "Not turned on yet").map(a => "Turn on a second login step for " + a.name)).concat(S.carrier.name && S.carrier.lock === D.carrierLocks[3] ? ["Ask " + S.carrier.name + " for a number lock and an account PIN"] : []);
    return { mode: "prepared", orderRef: GATE.order ? "Order " + GATE.order : "", seller,
      me: { first: helper.split(/\s+/)[0] || "", phone: S.client.helperPhone, email: "", name: "", brand: seller.product || "Family Security Playbook", company: seller.name || "" },
      client: { ...S.client, date: fmt(today), version: "1", reviewBy: fmt(nextYear) },
      banks: named(S.banks), contacts: named(S.contacts), accounts: named(S.accounts), devices: named(S.devices),
      carrier: { ...S.carrier, account: "", plan: "" }, codeWord: S.codeWord, mfa: { app: "", backup: S.mfa.backup }, pm: S.pm, remote: {},
      incident: { fixes: S.done, todo: [...new Set(todo)] }, hotlines: D.hotlines, hotlinesChecked: D.hotlinesChecked || D.carriersChecked,
      include: { carrier: !!S.carrier.name, mfa: true, remote: false, incident: true, pm: !!S.pm.name.trim(), redflags: true, devices: named(S.devices).length > 0, routine: true, report: true, family: true } };
  }
  async function make() {
    const btn = $("make");
    if (!S.client.name.trim()) { say("Go back to step 2 and enter the name for the playbook.", "bad"); return; }
    if (!window.jspdf || !window.Playbook) { say("The page did not finish loading. Reload it and try again.", "bad"); return; }
    btn.disabled = true; say("Checking your access…");
    try {
      const h = await nameHash(S.client.name);
      const r = await fetch("/api/claim", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: GATE.t, h }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) { say(j.message || "Your access could not be confirmed. Use the link from your email, or contact us.", "bad"); return; }
      const doc = window.Playbook.build(window.jspdf.jsPDF, data());
      const blob = doc.output("blob"); lastPdf = { blob, h };
      offer("Security-Playbook-" + S.client.name.trim().replace(/[^a-z0-9]+/gi, "-") + ".pdf", blob);
      say("Your playbook is downloading. Print it and keep it by the computer.", "ok");
    } catch (err) { say("Something went wrong building the playbook. Check your connection and try again.", "bad"); }
    finally { btn.disabled = false; }
  }
  draw();
})();
</script>
